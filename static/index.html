<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAG Retriever · Week 9</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: {
          brand: { 50:'#eef2ff', 100:'#e0e7ff', 400:'#818cf8', 500:'#6366f1', 600:'#4f46e5', 700:'#4338ca' },
        },
        keyframes: {
          fadeUp: { '0%':{opacity:'0',transform:'translateY(8px)'}, '100%':{opacity:'1',transform:'translateY(0)'} },
          shimmer: { '0%':{backgroundPosition:'-200% 0'}, '100%':{backgroundPosition:'200% 0'} },
        },
        animation: {
          'fade-up': 'fadeUp 0.35s ease-out',
          'shimmer': 'shimmer 1.6s linear infinite',
        },
      },
    }
  };
</script>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
  html, body { height: 100%; }
  body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  .bg-canvas {
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,0.10), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(168,85,247,0.08), transparent 55%),
      #fafaf9;
  }
  .dark .bg-canvas {
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,0.15), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(168,85,247,0.10), transparent 55%),
      #0a0a0b;
  }

  .glass {
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(0,0,0,0.06);
  }
  .dark .glass {
    background: rgba(24,24,27,0.72);
    border: 1px solid rgba(255,255,255,0.06);
  }

  .scroll-thin::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll-thin::-webkit-scrollbar-track { background: transparent; }
  .scroll-thin::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
  .dark .scroll-thin::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }

  .cite-chip {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 20px; height: 20px; padding: 0 6px;
    margin: 0 2px; border-radius: 6px;
    background: rgba(99,102,241,0.12);
    color: #4f46e5; font-size: 11px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
    vertical-align: middle; line-height: 1; text-decoration: none;
  }
  .dark .cite-chip { background: rgba(99,102,241,0.20); color: #a5b4fc; }
  .cite-chip:hover { background: rgba(99,102,241,0.25); transform: translateY(-1px); }
  .dark .cite-chip:hover { background: rgba(99,102,241,0.35); }
  .cite-chip.active { background: #4f46e5; color: white; }

  .source-card {
    transition: box-shadow 0.3s, border-color 0.3s, transform 0.3s;
  }
  .source-card.flash {
    box-shadow: 0 0 0 3px rgba(99,102,241,0.4);
    border-color: #6366f1 !important;
    transform: translateY(-2px);
  }

  .md { line-height: 1.7; }
  .md p { margin: 0.6em 0; }
  .md p:first-child { margin-top: 0; }
  .md p:last-child { margin-bottom: 0; }
  .md strong { font-weight: 600; color: #18181b; }
  .dark .md strong { color: #fafafa; }
  .md ul, .md ol { margin: 0.6em 0; padding-left: 1.4em; }
  .md li { margin: 0.25em 0; }
  .md ul { list-style: disc; }
  .md ol { list-style: decimal; }
  .md code {
    background: rgba(0,0,0,0.06); padding: 0.1em 0.35em;
    border-radius: 4px; font-size: 0.9em;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .dark .md code { background: rgba(255,255,255,0.08); }
  .md h1,.md h2,.md h3 { font-weight: 600; margin: 0.8em 0 0.4em; }
  .md h3 { font-size: 1em; }

  .skeleton {
    background: linear-gradient(90deg,
      rgba(0,0,0,0.04) 0%, rgba(0,0,0,0.08) 50%, rgba(0,0,0,0.04) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.6s linear infinite;
    border-radius: 6px;
  }
  .dark .skeleton {
    background: linear-gradient(90deg,
      rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.04) 100%);
    background-size: 200% 100%;
  }

  @keyframes toastIn { from{opacity:0;transform:translateY(-8px) scale(0.98)} to{opacity:1;transform:translateY(0) scale(1)} }
  .toast { animation: toastIn 0.25s ease-out; }
</style>
</head>

<body class="bg-canvas text-zinc-800 dark:text-zinc-100 transition-colors duration-300">
<div class="min-h-screen flex flex-col">

  <!-- ═══ NAV ═══ -->
  <header class="sticky top-0 z-30 glass border-b border-black/5 dark:border-white/5">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <button id="sidebarToggle" class="lg:hidden p-2 -ml-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5" aria-label="Toggle sidebar">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
        <div class="min-w-0">
          <h1 class="font-semibold text-[15px] leading-tight truncate">RAG Retriever</h1>
          <p class="text-[11px] text-zinc-500 dark:text-zinc-400 leading-tight truncate">Week 9 · Hybrid retrieval & citations</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span id="healthBadge" class="hidden sm:inline-flex items-center gap-1.5 text-[11px] font-medium px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 border border-emerald-500/20">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="healthText">checking…</span>
        </span>
        <button id="themeToggle" class="p-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5" aria-label="Toggle theme">
          <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ═══ MAIN ═══ -->
  <div class="flex-1 max-w-[1600px] w-full mx-auto px-4 sm:px-6 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- ─── SIDEBAR: Documents ─── -->
    <aside id="sidebar" class="hidden lg:block lg:col-span-4 xl:col-span-3 space-y-4">
      <div class="glass rounded-2xl p-4 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-semibold text-sm">Documents</h2>
          <span id="docCount" class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400">0</span>
        </div>

        <!-- Upload zone -->
        <label id="dropZone"
          class="block border-2 border-dashed border-zinc-300 dark:border-zinc-700 rounded-xl p-4 text-center cursor-pointer hover:border-indigo-500 hover:bg-indigo-50/50 dark:hover:bg-indigo-500/5 transition-all">
          <input id="fileInput" type="file" accept=".pdf,.txt,.md" class="hidden" />
          <svg class="w-7 h-7 mx-auto text-zinc-400 dark:text-zinc-500 mb-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 16a4 4 0 01-.88-7.9A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
          <p class="text-xs font-medium">Drop a file or click</p>
          <p class="text-[10px] text-zinc-500 dark:text-zinc-400 mt-0.5">PDF, TXT, MD · max 10 MB</p>
        </label>
      </div>

      <!-- Document list -->
      <div id="docList" class="space-y-2"></div>

      <div id="docEmpty" class="text-center py-8 px-4">
        <div class="w-12 h-12 mx-auto rounded-full bg-zinc-100 dark:bg-zinc-800/50 flex items-center justify-center mb-2">
          <svg class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        </div>
        <p class="text-xs text-zinc-500 dark:text-zinc-400">No documents yet</p>
        <p class="text-[10px] text-zinc-400 dark:text-zinc-500 mt-0.5">Upload one to get started</p>
      </div>
    </aside>

    <!-- ─── MAIN PANEL ─── -->
    <main class="lg:col-span-8 xl:col-span-9 flex flex-col min-h-[calc(100vh-7rem)]">

      <!-- Mode tabs -->
      <div class="flex items-center gap-1 mb-4 p-1 rounded-xl bg-zinc-100/80 dark:bg-zinc-900/60 backdrop-blur w-fit">
        <button data-tab="ask" class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium transition-all bg-white dark:bg-zinc-800 shadow-sm">
          <span class="flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
            Ask
          </span>
        </button>
        <button data-tab="search" class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition-all">
          <span class="flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            Search
          </span>
        </button>
      </div>

      <!-- ─── ASK TAB ─── -->
      <section id="tab-ask" class="flex-1 flex flex-col">
        <div id="chat" class="flex-1 glass rounded-2xl p-4 sm:p-6 shadow-sm overflow-y-auto scroll-thin mb-4 min-h-[400px] max-h-[calc(100vh-16rem)]">

          <!-- Empty state -->
          <div id="chatEmpty" class="h-full flex flex-col items-center justify-center text-center py-12">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-xl shadow-indigo-500/20 mb-4">
              <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
            </div>
            <h3 class="font-semibold text-lg mb-1">Ask your documents</h3>
            <p class="text-sm text-zinc-500 dark:text-zinc-400 max-w-sm">
              Upload and index a document, then ask anything. Answers come back with clickable citations to the source pages.
            </p>
            <div class="mt-5 flex flex-wrap gap-2 justify-center">
              <button class="sample-q text-xs px-3 py-1.5 rounded-full border border-zinc-300 dark:border-zinc-700 hover:border-indigo-500 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">When should I use agentic retrieval?</button>
              <button class="sample-q text-xs px-3 py-1.5 rounded-full border border-zinc-300 dark:border-zinc-700 hover:border-indigo-500 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">Difference between agentic RAG and classic RAG?</button>
            </div>
          </div>

          <div id="messages" class="space-y-6"></div>
        </div>

        <!-- Ask input -->
        <form id="askForm" class="glass rounded-2xl p-2 shadow-sm flex items-end gap-2">
          <textarea id="askInput" rows="1" placeholder="Ask a question about your documents…"
            class="flex-1 resize-none bg-transparent px-3 py-2.5 text-sm outline-none placeholder:text-zinc-400 dark:placeholder:text-zinc-500 max-h-32 scroll-thin"></textarea>
          <button type="submit" id="askBtn"
            class="shrink-0 w-10 h-10 rounded-xl bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white flex items-center justify-center transition-colors shadow-lg shadow-indigo-500/20">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </form>
      </section>

      <!-- ─── SEARCH TAB ─── -->
      <section id="tab-search" class="hidden flex-1 flex flex-col">
        <div class="glass rounded-2xl p-4 shadow-sm mb-4 flex flex-wrap items-center gap-3">
          <div class="flex-1 min-w-[200px]">
            <input id="searchInput" type="text" placeholder="Search your documents…"
              class="w-full bg-transparent px-3 py-2 text-sm outline-none placeholder:text-zinc-400" />
          </div>
          <div class="flex items-center gap-1 p-1 rounded-lg bg-zinc-100 dark:bg-zinc-900">
            <button data-mode="hybrid" class="mode-btn px-3 py-1 rounded text-xs font-medium bg-white dark:bg-zinc-800 shadow-sm">Hybrid</button>
            <button data-mode="vector" class="mode-btn px-3 py-1 rounded text-xs font-medium text-zinc-600 dark:text-zinc-400">Vector</button>
            <button data-mode="keyword" class="mode-btn px-3 py-1 rounded text-xs font-medium text-zinc-600 dark:text-zinc-400">Keyword</button>
          </div>
          <button id="searchBtn" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium transition-colors">Search</button>
        </div>

        <div id="searchResults" class="flex-1 glass rounded-2xl p-4 sm:p-6 shadow-sm overflow-y-auto scroll-thin min-h-[400px]">
          <div class="h-full flex flex-col items-center justify-center text-center py-12 text-zinc-400">
            <svg class="w-12 h-12 mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <p class="text-sm">Run a search to see ranked chunks</p>
          </div>
        </div>
      </section>

    </main>
  </div>
</div>

<!-- Toasts -->
<div id="toasts" class="fixed top-20 right-4 z-50 space-y-2"></div>

<script>
const API = '';  // same-origin since served by FastAPI

const state = {
  docs: JSON.parse(localStorage.getItem('rag_docs') || '[]'),
  mode: 'hybrid',
  busy: false,
};
const saveDocs = () => localStorage.setItem('rag_docs', JSON.stringify(state.docs));

const root = document.documentElement;
const savedTheme = localStorage.getItem('rag_theme');
if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
  root.classList.add('dark');
}
document.getElementById('themeToggle').addEventListener('click', () => {
  root.classList.toggle('dark');
  localStorage.setItem('rag_theme', root.classList.contains('dark') ? 'dark' : 'light');
});

function toast(message, type = 'info') {
  const colors = {
    info:    'bg-white dark:bg-zinc-900 border-zinc-200 dark:border-zinc-800',
    success: 'bg-emerald-50 dark:bg-emerald-950/60 border-emerald-200 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200',
    error:   'bg-rose-50 dark:bg-rose-950/60 border-rose-200 dark:border-rose-800 text-rose-900 dark:text-rose-200',
  };
  const el = document.createElement('div');
  el.className = `toast max-w-sm px-4 py-3 rounded-xl border shadow-lg text-sm font-medium ${colors[type]}`;
  el.textContent = message;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.4s'; }, 3500);
  setTimeout(() => el.remove(), 4000);
}

async function checkHealth() {
  try {
    const r = await fetch(`${API}/health`);
    if (!r.ok) throw new Error();
    document.getElementById('healthText').textContent = 'online';
  } catch {
    document.getElementById('healthText').textContent = 'offline';
    document.getElementById('healthBadge').className =
      'hidden sm:inline-flex items-center gap-1.5 text-[11px] font-medium px-2.5 py-1 rounded-full bg-rose-500/10 text-rose-700 dark:text-rose-400 border border-rose-500/20';
  }
}
checkHealth();

document.getElementById('sidebarToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('hidden');
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.remove('bg-white','dark:bg-zinc-800','shadow-sm');
      b.classList.add('text-zinc-600','dark:text-zinc-400');
    });
    btn.classList.add('bg-white','dark:bg-zinc-800','shadow-sm');
    btn.classList.remove('text-zinc-600','dark:text-zinc-400');

    document.querySelectorAll('#tab-ask, #tab-search').forEach(s => s.classList.add('hidden'));
    document.getElementById(`tab-${btn.dataset.tab}`).classList.remove('hidden');
  });
});

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

['dragover','dragenter'].forEach(ev => dropZone.addEventListener(ev, e => {
  e.preventDefault();
  dropZone.classList.add('border-indigo-500','bg-indigo-50/50','dark:bg-indigo-500/5');
}));
['dragleave','drop'].forEach(ev => dropZone.addEventListener(ev, e => {
  e.preventDefault();
  dropZone.classList.remove('border-indigo-500','bg-indigo-50/50','dark:bg-indigo-500/5');
}));
dropZone.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) uploadFile(f);
});
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) uploadFile(e.target.files[0]);
  e.target.value = '';
});

async function uploadFile(file) {
  const fd = new FormData();
  fd.append('file', file);
  toast(`Uploading ${file.name}…`, 'info');
  try {
    const r = await fetch(`${API}/upload`, { method: 'POST', body: fd });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.detail || `Upload failed (${r.status})`);
    }
    const doc = await r.json();
    doc.uploadedAt = Date.now();
    doc.indexed = false;
    state.docs.unshift(doc);
    saveDocs();
    renderDocs();
    toast('Uploaded — click Index to embed', 'success');
  } catch (e) {
    toast(e.message, 'error');
  }
}

function renderDocs() {
  const list = document.getElementById('docList');
  const empty = document.getElementById('docEmpty');
  const count = document.getElementById('docCount');
  count.textContent = state.docs.length;

  if (!state.docs.length) {
    list.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = state.docs.map((d, i) => `
    <div class="glass rounded-xl p-3 shadow-sm animate-fade-up" style="animation-delay:${i*40}ms">
      <div class="flex items-start gap-2">
        <div class="w-8 h-8 rounded-lg bg-indigo-50 dark:bg-indigo-500/10 flex items-center justify-center shrink-0">
          <svg class="w-4 h-4 text-indigo-600 dark:text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-medium truncate" title="${escapeAttr(d.original_filename || d.doc_id)}">${escapeHtml(d.original_filename || d.doc_id)}</p>
          <p class="text-[10px] text-zinc-500 dark:text-zinc-400 mt-0.5">
            ${d.size_bytes ? (d.size_bytes/1024).toFixed(0)+' KB · ' : ''}${d.indexed ? '<span class="text-emerald-600 dark:text-emerald-400">● indexed</span>' : '<span class="text-amber-600 dark:text-amber-400">● not indexed</span>'}
          </p>
        </div>
        <button data-remove="${i}" class="p-1 rounded hover:bg-black/5 dark:hover:bg-white/5 text-zinc-400 hover:text-rose-500" title="Remove">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="mt-2 flex gap-1.5">
        <button data-preview="${i}" class="flex-1 text-[11px] font-medium px-2 py-1 rounded-lg bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 transition-colors">Preview</button>
        <button data-index="${i}" class="flex-1 text-[11px] font-medium px-2 py-1 rounded-lg ${d.indexed ? 'bg-emerald-50 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-400' : 'bg-indigo-600 text-white hover:bg-indigo-700'} transition-colors">
          ${d.indexed ? '✓ Indexed' : 'Index'}
        </button>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => {
    state.docs.splice(+b.dataset.remove, 1);
    saveDocs(); renderDocs();
  }));
  list.querySelectorAll('[data-preview]').forEach(b => b.addEventListener('click', () => previewDoc(+b.dataset.preview)));
  list.querySelectorAll('[data-index]').forEach(b => b.addEventListener('click', () => indexDoc(+b.dataset.index, b)));
}

async function previewDoc(i) {
  const d = state.docs[i];
  try {
    const r = await fetch(`${API}/documents/${d.doc_id}/preview`);
    if (!r.ok) throw new Error('Preview failed');
    const data = await r.json();
    addMessage('system', `**Preview — ${escapeHtml(d.original_filename || d.doc_id)}**\n\n${data.page_count} pages, ${data.total_chars.toLocaleString()} characters extracted.\n\nFirst page:\n\n> ${data.pages[0]?.preview || '(empty)'}`);
  } catch (e) { toast(e.message, 'error'); }
}

async function indexDoc(i, btn) {
  const d = state.docs[i];
  const orig = btn.textContent;
  btn.textContent = 'Indexing…';
  btn.disabled = true;
  try {
    const r = await fetch(`${API}/documents/${d.doc_id}/index?strategy=structure_aware`, { method: 'POST' });
    if (!r.ok) throw new Error('Index failed');
    const data = await r.json();
    state.docs[i].indexed = true;
    saveDocs(); renderDocs();
    toast(`Indexed ${data.chunks_added ?? ''} chunks`, 'success');
  } catch (e) {
    toast(e.message, 'error');
    btn.textContent = orig;
    btn.disabled = false;
  }
}

const chat = document.getElementById('chat');
const messages = document.getElementById('messages');
const chatEmpty = document.getElementById('chatEmpty');
const askForm = document.getElementById('askForm');
const askInput = document.getElementById('askInput');
const askBtn = document.getElementById('askBtn');

askInput.addEventListener('input', () => {
  askInput.style.height = 'auto';
  askInput.style.height = Math.min(askInput.scrollHeight, 128) + 'px';
});
askInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); askForm.requestSubmit(); }
});

document.querySelectorAll('.sample-q').forEach(b => b.addEventListener('click', () => {
  askInput.value = b.textContent;
  askForm.requestSubmit();
}));

askForm.addEventListener('submit', async e => {
  e.preventDefault();
  const q = askInput.value.trim();
  if (!q || state.busy) return;
  state.busy = true;
  askBtn.disabled = true;
  askInput.value = '';
  askInput.style.height = 'auto';

  if (chatEmpty) chatEmpty.style.display = 'none';
  addMessage('user', q);
  const loadingId = addLoading();

  try {
    const r = await fetch(`${API}/ask?q=${encodeURIComponent(q)}&n=5`);
    if (!r.ok) throw new Error(`Request failed (${r.status})`);
    const data = await r.json();
    removeLoading(loadingId);
    renderAnswer(data);
  } catch (err) {
    removeLoading(loadingId);
    addMessage('assistant', `⚠️ ${err.message}`);
  } finally {
    state.busy = false;
    askBtn.disabled = false;
    askInput.focus();
  }
});

function addMessage(role, text) {
  const wrap = document.createElement('div');
  wrap.className = `flex gap-3 animate-fade-up ${role === 'user' ? 'justify-end' : ''}`;

  if (role === 'user') {
    wrap.innerHTML = `
      <div class="max-w-[85%] rounded-2xl rounded-tr-sm bg-indigo-600 text-white px-4 py-2.5 text-sm shadow-lg shadow-indigo-500/20">
        ${escapeHtml(text)}
      </div>`;
  } else if (role === 'system') {
    wrap.innerHTML = `
      <div class="max-w-full rounded-2xl bg-zinc-100 dark:bg-zinc-900/60 border border-zinc-200 dark:border-zinc-800 px-4 py-3 text-xs md text-zinc-700 dark:text-zinc-300">
        ${marked.parse(text)}
      </div>`;
  } else {
    wrap.innerHTML = `
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 shrink-0 flex items-center justify-center">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      </div>
      <div class="max-w-[85%] rounded-2xl rounded-tl-sm glass px-4 py-3 text-sm md">
        ${marked.parse(text)}
      </div>`;
  }
  messages.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return wrap;
}

function addLoading() {
  const id = 'load-' + Date.now();
  const wrap = document.createElement('div');
  wrap.id = id;
  wrap.className = 'flex gap-3 animate-fade-up';
  wrap.innerHTML = `
    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 shrink-0 flex items-center justify-center">
      <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
    </div>
    <div class="max-w-[85%] rounded-2xl rounded-tl-sm glass px-4 py-3 space-y-2 w-full">
      <div class="skeleton h-3 w-3/4"></div>
      <div class="skeleton h-3 w-full"></div>
      <div class="skeleton h-3 w-5/6"></div>
      <div class="flex items-center gap-1.5 pt-1">
        <span class="text-[10px] text-zinc-400">Retrieving → reranking → generating…</span>
      </div>
    </div>`;
  messages.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return id;
}
function removeLoading(id) { document.getElementById(id)?.remove(); }

function renderAnswer(data) {
  const wrap = document.createElement('div');
  wrap.className = 'flex gap-3 animate-fade-up';

  const withChips = data.answer.replace(/\[(\d+)\]/g, '<sup class="cite-chip" data-cite="$1">[$1]</sup>');
  const answerHtml = marked.parse(withChips);

  const sourcesHtml = (data.sources || []).map((s, i) => `
    <div class="source-card rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white/50 dark:bg-zinc-900/40 p-3"
         id="source-${s.id}" data-source-id="${s.id}">
      <div class="flex items-start justify-between gap-2 mb-1.5">
        <div class="flex items-center gap-1.5 min-w-0">
          <span class="shrink-0 w-5 h-5 rounded-md bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 text-[10px] font-bold flex items-center justify-center">${s.id}</span>
          <span class="text-[11px] font-medium truncate">${escapeHtml(s.citation)}</span>
        </div>
        ${s.rerank_score != null ? `<span class="shrink-0 text-[10px] font-mono px-1.5 py-0.5 rounded bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400">${(+s.rerank_score).toFixed(2)}</span>` : ''}
      </div>
      <p class="text-[11px] leading-relaxed text-zinc-600 dark:text-zinc-400 line-clamp-3">${escapeHtml(s.excerpt || '')}</p>
    </div>
  `).join('');

  const refusedBanner = data.refused
    ? `<div class="flex items-start gap-2 mb-3 p-3 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900/60">
         <svg class="w-4 h-4 shrink-0 mt-0.5 text-amber-600 dark:text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M5.07 19h13.86a2 2 0 001.74-2.99l-6.93-12a2 2 0 00-3.48 0l-6.93 12A2 2 0 005.07 19z"/></svg>
         <p class="text-xs text-amber-800 dark:text-amber-200">Refused — retrieval found insufficient evidence. ${data.reason ? `Reason: <code class="font-mono">${escapeHtml(data.reason)}</code>` : ''}</p>
       </div>` : '';

  wrap.innerHTML = `
    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 shrink-0 flex items-center justify-center">
      <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
    </div>
    <div class="max-w-[85%] min-w-0 space-y-3">
      <div class="rounded-2xl rounded-tl-sm glass px-4 py-3">
        ${refusedBanner}
        <div class="text-sm md">${answerHtml}</div>
      </div>
      ${sourcesHtml ? `
        <details open class="group">
          <summary class="cursor-pointer text-[11px] font-medium text-zinc-500 dark:text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 select-none flex items-center gap-1.5">
            <svg class="w-3 h-3 transition-transform group-open:rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
            Sources (${data.sources.length})
          </summary>
          <div class="grid sm:grid-cols-2 gap-2 mt-2">${sourcesHtml}</div>
        </details>
      ` : ''}
    </div>
  `;
  messages.appendChild(wrap);

  wrap.querySelectorAll('.cite-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const id = chip.dataset.cite;
      const card = wrap.querySelector(`#source-${id}`);
      if (!card) return;
      const details = card.closest('details');
      if (details) details.open = true;
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('flash');
      wrap.querySelectorAll('.cite-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      setTimeout(() => card.classList.remove('flash'), 1600);
    });
  });

  chat.scrollTop = chat.scrollHeight;
}

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => {
      b.classList.remove('bg-white','dark:bg-zinc-800','shadow-sm');
      b.classList.add('text-zinc-600','dark:text-zinc-400');
    });
    btn.classList.add('bg-white','dark:bg-zinc-800','shadow-sm');
    btn.classList.remove('text-zinc-600','dark:text-zinc-400');
    state.mode = btn.dataset.mode;
  });
});

document.getElementById('searchBtn').addEventListener('click', runSearch);
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') runSearch();
});

async function runSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  const box = document.getElementById('searchResults');
  box.innerHTML = Array(4).fill(0).map(() => `
    <div class="p-3 mb-2 rounded-xl border border-zinc-200 dark:border-zinc-800 space-y-2">
      <div class="skeleton h-3 w-1/3"></div>
      <div class="skeleton h-3 w-full"></div>
      <div class="skeleton h-3 w-5/6"></div>
    </div>`).join('');

  const endpoints = { hybrid: 'hybrid', vector: 'search', keyword: 'search/keyword' };
  try {
    const url = state.mode === 'hybrid'
      ? `${API}/search/${endpoints.hybrid}?q=${encodeURIComponent(q)}&n=8`
      : `${API}/${endpoints[state.mode]}?q=${encodeURIComponent(q)}&n=8`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(`Search failed (${r.status})`);
    const data = await r.json();
    const results = data.results || [];

    if (!results.length) {
      box.innerHTML = `<div class="text-center py-12 text-zinc-400 text-sm">No results</div>`;
      return;
    }

    box.innerHTML = `
      <p class="text-xs text-zinc-500 dark:text-zinc-400 mb-3">${results.length} results · mode: <span class="font-medium">${state.mode}</span></p>
      ${results.map((h, i) => `
        <div class="p-3 mb-2 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white/50 dark:bg-zinc-900/40 animate-fade-up" style="animation-delay:${i*30}ms">
          <div class="flex items-center justify-between gap-2 mb-1.5">
            <div class="flex items-center gap-1.5 min-w-0">
              <span class="w-5 h-5 rounded-md bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 text-[10px] font-bold flex items-center justify-center shrink-0">${i+1}</span>
              <span class="text-[11px] font-medium truncate">${escapeHtml(h.citation || '')}</span>
            </div>
            ${h.rerank_score != null ? `<span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400">rerank ${(+h.rerank_score).toFixed(2)}</span>` : ''}
            ${h.score != null ? `<span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400">score ${(+h.score).toFixed(3)}</span>` : ''}
          </div>
          <p class="text-xs leading-relaxed text-zinc-600 dark:text-zinc-400">${escapeHtml((h.text || '').slice(0, 320))}${(h.text || '').length > 320 ? '…' : ''}</p>
        </div>`).join('')}`;
  } catch (e) {
    box.innerHTML = `<div class="text-center py-12 text-rose-500 text-sm">${escapeHtml(e.message)}</div>`;
  }
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

renderDocs();
askInput.focus();
</script>
</body>
</html>
